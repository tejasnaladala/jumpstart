name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install
      - name: typecheck
        run: bun run typecheck
      - name: lint
        # Closes DevOps audit finding: lint failures should block CI, not be
        # swallowed with a soft echo. The custom loop.sh enforces voice rules
        # (em-dashes, console.log, etc.) and a regression there should fail
        # the build, not append a friendly note.
        run: bun run lint
      - name: build
        run: bun run build

  evals:
    runs-on: ubuntu-latest
    # Run on every push to master too so a direct push without a PR doesn't
    # bypass eval gating. Closes DevOps audit finding (PR-only was a hole).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install
      - name: agent evals (stub mode if no key, strict on regressions)
        run: bun run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRICT: "1"

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
